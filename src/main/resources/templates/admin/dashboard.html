<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid app-layout">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>
        </div>
        <main class="content-column">
            <div class="page-heading"><div><p class="eyebrow">Operations overview</p><h1>Admin dashboard</h1></div></div>
            <div class="row g-3">
                <div class="col-sm-6 col-xl-4"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Total Students</div><div class="stat-value" th:text="${studentCount}"></div></div></div>
                <div class="col-sm-6 col-xl-4"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Total Rooms</div><div class="stat-value" th:text="${roomCount}"></div></div></div>
                <div class="col-sm-6 col-xl-4"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Available Rooms</div><div class="stat-value" th:text="${availableRooms}"></div></div></div>
                <div class="col-sm-6 col-xl-4"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Occupied Rooms</div><div class="stat-value" th:text="${occupiedRooms}"></div></div></div>
                <div class="col-sm-6 col-xl-4"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Pending Complaints</div><div class="stat-value" th:text="${pendingComplaints}"></div></div></div>
                <div class="col-sm-6 col-xl-4"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Pending Fees</div><div class="stat-value" th:text="${pendingFees}"></div></div></div>
            </div>
            <div class="surface-card p-4 mt-4"><p class="eyebrow">System configuration</p><p class="mb-0">Default fee currency: <strong th:text="${singletonInfo}"></strong></p></div>
        </main>
    </div>
</div>
</body>
</html>
