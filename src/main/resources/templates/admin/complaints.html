<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Complaint Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Complaint Management</h2>
            <table class="table table-striped table-bordered">
                <thead>
                <tr><th>ID</th><th>Student</th><th>Title</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody>
                <tr th:each="complaint : ${complaints}">
                    <td th:text="${complaint.id}"></td>
                    <td th:text="${complaint.student.name}"></td>
                    <td th:text="${complaint.title}"></td>
                    <td th:text="${complaint.status}"></td>
                    <td>
                        <a class="btn btn-sm btn-info" th:href="@{/admin/complaints/{id}(id=${complaint.id})}">View</a>
                        <form th:action="@{/admin/complaints/resolve/{id}(id=${complaint.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="status" value="RESOLVED" />
                            <button class="btn btn-sm btn-success" type="submit">Resolve</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
