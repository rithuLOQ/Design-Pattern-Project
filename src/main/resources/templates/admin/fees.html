<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Fee Management</h2>
            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/admin/fees/generate}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Student</label>
                                <select class="form-select" name="studentId">
                                    <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Amount</label>
                                <input class="form-control" type="number" step="0.01" name="amount" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Due Date</label>
                                <input class="form-control" type="date" name="dueDate" required>
                            </div>
                        </div>
                        <button class="btn btn-primary mt-3" type="submit">Generate Fee</button>
                    </form>
                </div>
            </div>
            <table class="table table-striped table-bordered">
                <thead><tr><th>ID</th><th>Student</th><th>Amount</th><th>Due Date</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="fee : ${fees}">
                    <td th:text="${fee.id}"></td>
                    <td th:text="${fee.student.name}"></td>
                    <td th:text="${fee.amount}"></td>
                    <td th:text="${fee.dueDate}"></td>
                    <td th:text="${fee.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
