<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Hostel Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container" style="max-width: 440px;">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white text-center py-4">
            <div class="display-6 mb-1"><i class="bi bi-building-lock"></i></div>
            <h4 class="fw-bold mb-0">SMART HOSTEL</h4>
            <small class="text-white-50">Enterprise Management System</small>
        </div>

        <div class="card-body p-4">
            <!-- Alert Messages -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-dark">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-dark">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold rounded-3">
                    Sign In <i class="bi bi-arrow-right-short ms-1"></i>
                </button>
            </form>

            <hr class="my-4">

            <!-- Quick Demo Credentials Box -->
            <div class="bg-light p-3 rounded-3 border">
                <div class="fw-bold text-dark small mb-2"><i class="bi bi-info-circle text-primary me-1"></i> Demo Login Accounts:</div>
                <div class="small text-muted d-flex justify-content-between mb-1">
                    <span><strong>Admin:</strong> <code>admin</code></span>
                    <span>Password: <code>admin123</code></span>
                </div>
                <div class="small text-muted d-flex justify-content-between mb-1">
                    <span><strong>Warden:</strong> <code>warden</code></span>
                    <span>Password: <code>warden123</code></span>
                </div>
                <div class="small text-muted d-flex justify-content-between">
                    <span><strong>Student:</strong> <code>student1</code></span>
                    <span>Password: <code>student123</code></span>
                </div>
            </div>
        </div>

        <div class="card-footer bg-white text-center py-3 border-0">
            <small class="text-muted">GoF Patterns: Singleton • Factory Method • Builder</small>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
