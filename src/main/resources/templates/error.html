<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | Smart Hostel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-shell">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
    <div class="empty-state text-center mx-auto">
        <div class="status-icon status-icon-danger">!</div>
        <p class="eyebrow">Request not completed</p>
        <h1 class="h3" th:text="${errorTitle ?: 'Something went wrong'}">Something went wrong</h1>
        <p class="text-secondary mb-4" th:text="${errorMessage ?: 'Please try again.'}">Please try again.</p>
        <a class="btn btn-primary" th:href="@{/default}">Return to dashboard</a>
    </div>
</main>
</body>
</html>
