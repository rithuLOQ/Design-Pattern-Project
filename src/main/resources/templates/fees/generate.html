<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}"></head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='fees')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: top-navbar(pageHeader='Generate Hostel Fee Billing')}"></div>

        <div class="page-body">
            <div class="card border-0 shadow-sm rounded-4" style="max-width: 700px;">
                <div class="card-body p-4">
                    <form th:action="@{/fees/save}" th:object="${feeDto}" method="post">

                        <div class="mb-3">
                            <label for="studentId" class="form-label font-semibold">Select Student *</label>
                            <select th:field="*{studentId}" class="form-select" th:errorclass="is-invalid" required>
                                <option value="">-- Choose Student --</option>
                                <option th:each="st : ${students}" th:value="${st.id}" th:text="${st.name + ' (' + st.registrationNumber + ' - Dept: ' + st.department + ')'}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{studentId}">Student Selection Error</div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="amount" class="form-label font-semibold">Fee Amount (₹) *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="0.01" th:field="*{amount}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. 25000.00" required>
                                </div>
                                <div class="invalid-feedback" th:errors="*{amount}">Amount Error</div>
                            </div>

                            <div class="col-md-6">
                                <label for="dueDate" class="form-label font-semibold">Due Date *</label>
                                <input type="date" th:field="*{dueDate}" class="form-control" th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:errors="*{dueDate}">Due Date Error</div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/fees}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-receipt-cutoff me-1"></i> Generate Bill</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer-scripts}"></div>
    </div>
</div>

</body>
</html>
