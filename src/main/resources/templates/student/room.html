<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: studentSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Room Details</h2>
            <div class="card">
                <div class="card-body">
                    <p><strong>Room Number:</strong> <span th:text="${student.room != null ? student.room.roomNumber : 'Not assigned'}"></span></p>
                    <p><strong>Room Type:</strong> <span th:text="${student.room != null ? student.room.roomType : 'N/A'}"></span></p>
                    <p><strong>Status:</strong> <span th:text="${student.room != null ? student.room.status : 'N/A'}"></span></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
