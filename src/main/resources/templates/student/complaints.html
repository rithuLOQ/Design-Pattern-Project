<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Complaints</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: studentSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Complaints</h2>
            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/student/complaints}" th:object="${complaint}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3"><label class="form-label">Title</label><input class="form-control" th:field="*{title}"></div>
                        <div class="mb-3"><label class="form-label">Category</label><input class="form-control" th:field="*{category}"></div>
                        <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" th:field="*{description}"></textarea></div>
                        <button type="submit" class="btn btn-primary">Submit Complaint</button>
                    </form>
                </div>
            </div>
            <table class="table table-striped table-bordered">
                <thead><tr><th>Title</th><th>Category</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="complaint : ${complaints}">
                    <td th:text="${complaint.title}"></td>
                    <td th:text="${complaint.category}"></td>
                    <td th:text="${complaint.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
