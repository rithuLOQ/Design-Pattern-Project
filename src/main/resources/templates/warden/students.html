<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Warden Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: wardenSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Students</h2>
            <table class="table table-striped table-bordered">
                <thead><tr><th>Name</th><th>Registration</th><th>Room</th><th>Department</th></tr></thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.registrationNumber}"></td>
                    <td th:text="${student.room != null ? student.room.roomNumber : 'Unassigned'}"></td>
                    <td th:text="${student.department}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
