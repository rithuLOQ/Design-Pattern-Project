<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Warden Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid app-layout">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: wardenSidebar}"></div>
        </div>
        <main class="content-column">
            <div class="page-heading"><div><p class="eyebrow">Residence operations</p><h1>Warden dashboard</h1></div></div>
            <div class="row g-3">
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Students</div><div class="stat-value" th:text="${studentCount}"></div></div></div>
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Rooms</div><div class="stat-value" th:text="${roomStats.size()}"></div></div></div>
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Pending complaints</div><div class="stat-value" th:text="${pendingComplaints}"></div></div></div>
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-accent"></div><div class="stat-label">Fees listed</div><div class="stat-value" th:text="${feeCount}"></div></div></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
