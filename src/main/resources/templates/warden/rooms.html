<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Warden Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: wardenSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Rooms</h2>
            <table class="table table-striped table-bordered">
                <thead><tr><th>Room</th><th>Type</th><th>Capacity</th><th>Occupied</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.roomNumber}"></td>
                    <td th:text="${room.roomType}"></td>
                    <td th:text="${room.capacity}"></td>
                    <td th:text="${room.occupiedCount}"></td>
                    <td th:text="${room.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
