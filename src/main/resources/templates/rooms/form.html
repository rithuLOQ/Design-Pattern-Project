<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}"></head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='rooms')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: top-navbar(pageHeader=${isEdit ? 'Edit Room Configuration' : 'Add New Hostel Room'})}"></div>

        <div class="page-body">
            <div class="card border-0 shadow-sm rounded-4" style="max-width: 700px;">
                <div class="card-body p-4">
                    <form th:action="@{/rooms/save}" th:object="${roomDto}" method="post">
                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">
                            <label for="roomNumber" class="form-label font-semibold">Room Number *</label>
                            <input type="text" th:field="*{roomNumber}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. A-101" required th:readonly="${isEdit}">
                            <div class="invalid-feedback" th:errors="*{roomNumber}">Room Number Error</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="floor" class="form-label font-semibold">Floor Number *</label>
                                <input type="number" th:field="*{floor}" class="form-control" th:errorclass="is-invalid" min="0" required>
                                <div class="invalid-feedback" th:errors="*{floor}">Floor Error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="capacity" class="form-label font-semibold">Capacity (Beds) *</label>
                                <input type="number" th:field="*{capacity}" class="form-control" th:errorclass="is-invalid" min="1" max="6" required>
                                <div class="invalid-feedback" th:errors="*{capacity}">Capacity Error</div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="roomType" class="form-label font-semibold">Room Type *</label>
                                <select th:field="*{roomType}" class="form-select" required>
                                    <option th:each="rt : ${roomTypes}" th:value="${rt}" th:text="${rt}">SINGLE</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="status" class="form-label font-semibold">Room Status *</label>
                                <select th:field="*{status}" class="form-select" required>
                                    <option th:each="st : ${roomStatuses}" th:value="${st}" th:text="${st}">AVAILABLE</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/rooms}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-check-lg me-1"></i> Save Room</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer-scripts}"></div>
    </div>
</div>

</body>
</html>
