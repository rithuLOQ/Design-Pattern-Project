spring.application.name=smart-hostel-management-system-v2

# Default to H2 for local execution because the local MySQL installation in this environment is not accepting root credentials.
# The application is still configured for MySQL-compatible schema and can be switched by setting DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:hostel_v2;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

server.port=8080

logging.level.org.springframework.security=INFO
logging.level.com.hostel=INFO

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
