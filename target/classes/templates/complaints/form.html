<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}"></head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='complaints')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: top-navbar(pageHeader='Raise Maintenance Complaint')}"></div>

        <div class="page-body">
            <div class="card border-0 shadow-sm rounded-4" style="max-width: 700px;">
                <div class="card-body p-4">
                    <form th:action="@{/complaints/save}" th:object="${complaintDto}" method="post">

                        <div class="mb-3">
                            <label for="title" class="form-label font-semibold">Issue Title *</label>
                            <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. Electrical Fault in Fan, Plumbing Leakage" required>
                            <div class="invalid-feedback" th:errors="*{title}">Title Error</div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label font-semibold">Detailed Issue Description *</label>
                            <textarea th:field="*{description}" class="form-control" th:errorclass="is-invalid" rows="5" placeholder="Please describe the exact issue, room location, and time of problem..." required></textarea>
                            <div class="invalid-feedback" th:errors="*{description}">Description Error</div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/complaints}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4"><i class="bi bi-send me-1"></i> Submit Complaint</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer-scripts}"></div>
    </div>
</div>

</body>
</html>
