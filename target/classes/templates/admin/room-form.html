<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3>Room Form</h3>
                    <form th:action="${room.id == null ? '/admin/rooms/add' : '/admin/rooms/edit/' + room.id}" th:object="${room}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3"><label class="form-label">Room Number *</label><input required class="form-control" th:field="*{roomNumber}"><div class="text-danger small" th:errors="*{roomNumber}"></div></div>
                        <div class="mb-3"><label class="form-label">Room Type *</label><input required class="form-control" th:field="*{roomType}"><div class="text-danger small" th:errors="*{roomType}"></div></div>
                        <div class="mb-3"><label class="form-label">Capacity *</label><input required min="1" class="form-control" type="number" th:field="*{capacity}"><div class="text-danger small" th:errors="*{capacity}"></div></div>
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a th:href="@{/admin/rooms}" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
