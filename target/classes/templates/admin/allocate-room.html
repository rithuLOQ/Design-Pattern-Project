<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Allocate Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h3>Allocate Room</h3>
            <form th:action="@{/admin/rooms/allocate}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <select class="form-select" name="studentId">
                        <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name + ' (' + student.registrationNumber + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Room</label>
                    <select class="form-select" name="roomId">
                        <option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.roomNumber + ' (' + room.occupiedCount + '/' + room.capacity + ')'}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Allocate</button>
                <a th:href="@{/admin/rooms}" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
