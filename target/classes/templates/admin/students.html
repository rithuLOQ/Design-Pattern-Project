<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>
        </div>
        <div class="col-md-10">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Student Management</h2>
                <a class="btn btn-primary" th:href="@{/admin/students/add}">Add Student</a>
            </div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <table class="table table-striped table-bordered">
                <thead>
                <tr><th>ID</th><th>Name</th><th>Registration</th><th>Department</th><th>Room</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.registrationNumber}"></td>
                    <td th:text="${student.department}"></td>
                    <td th:text="${student.room != null ? student.room.roomNumber : 'Not assigned'}"></td>
                    <td>
                        <a class="btn btn-sm btn-warning" th:href="@{/admin/students/edit/{id}(id=${student.id})}">Edit</a>
                        <form th:action="@{/admin/students/delete/{id}(id=${student.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
