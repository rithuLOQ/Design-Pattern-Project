<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h3>Student Form</h3>
                    <form th:action="${student.id == null ? '/admin/students/add' : '/admin/students/edit/' + student.id}" th:object="${student}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Registration Number *</label><input class="form-control" required th:field="*{registrationNumber}"><div class="text-danger small" th:errors="*{registrationNumber}"></div></div>
                            <div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" required th:field="*{name}"><div class="text-danger small" th:errors="*{name}"></div></div>
                            <div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" required type="email" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div>
                            <div class="col-md-6"><label class="form-label">Phone *</label><input class="form-control" required th:field="*{phone}"><div class="text-danger small" th:errors="*{phone}"></div></div>
                            <div class="col-md-6"><label class="form-label">Department</label><input class="form-control" th:field="*{department}"></div>
                            <div class="col-md-6"><label class="form-label">Year</label><input class="form-control" type="number" th:field="*{year}"></div>
                            <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" th:field="*{address}"></textarea></div>
                            <div class="col-md-6"><label class="form-label">Parent Name</label><input class="form-control" th:field="*{parentName}"></div>
                            <div class="col-md-6"><label class="form-label">Parent Phone</label><input class="form-control" th:field="*{parentPhone}"></div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a th:href="@{/admin/students}" class="btn btn-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
