<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>
        </div>
        <div class="col-md-10">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Room Management</h2>
                <div>
                    <a class="btn btn-primary" th:href="@{/admin/rooms/add}">Add Room</a>
                    <a class="btn btn-success" th:href="@{/admin/rooms/allocate}">Allocate Room</a>
                </div>
            </div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <table class="table table-striped table-bordered">
                <thead><tr><th>ID</th><th>Room Number</th><th>Type</th><th>Capacity</th><th>Occupied</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.id}"></td>
                    <td th:text="${room.roomNumber}"></td>
                    <td th:text="${room.roomType}"></td>
                    <td th:text="${room.capacity}"></td>
                    <td th:text="${room.occupiedCount}"></td>
                    <td th:text="${room.status}"></td>
                    <td>
                        <a class="btn btn-sm btn-warning" th:href="@{/admin/rooms/edit/{id}(id=${room.id})}">Edit</a>
                        <form th:action="@{/admin/rooms/delete/{id}(id=${room.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                        </form>
                        <form th:action="@{/admin/rooms/vacate}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="studentId" th:value="${room.students != null and !room.students.isEmpty() ? room.students[0].id : 0}" />
                            <button class="btn btn-sm btn-secondary" type="submit" th:disabled="${room.students == null or room.students.isEmpty()}">Vacate</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
