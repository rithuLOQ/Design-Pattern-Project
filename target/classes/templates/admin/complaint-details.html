<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Complaint Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h3>Complaint: <span th:text="${complaint.title}"></span></h3>
            <p><strong>Student:</strong> <span th:text="${complaint.student.name}"></span></p>
            <p><strong>Category:</strong> <span th:text="${complaint.category}"></span></p>
            <p><strong>Status:</strong> <span th:text="${complaint.status}"></span></p>
            <p><strong>Description:</strong></p>
            <p th:text="${complaint.description}"></p>
            <a class="btn btn-secondary" th:href="@{/admin/complaints}">Back</a>
        </div>
    </div>
</div>
</body>
</html>
