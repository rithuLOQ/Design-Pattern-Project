<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hostel Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f4f7fb, #dfe9f5); }
        .login-card { max-width: 420px; margin: 120px auto; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="login-page">
<div class="container">
    <div class="login-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4"><span class="brand-mark" aria-hidden="true"></span><p class="eyebrow mt-3 mb-1">V2 Operations Portal</p><h1>Smart Hostel</h1><p class="text-secondary mb-0">Secure hostel management for every residence.</p></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-icon"><span aria-hidden="true"></span><input id="username" name="username" type="text" class="form-control" autocomplete="username" required></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-icon"><span aria-hidden="true"></span><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required><button class="password-toggle" type="button" onclick="togglePassword()" aria-label="Show or hide password">Show</button></div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Sign in</button>
            </form>

        </div>
    </div>
</div>
<script>function togglePassword(){const field=document.getElementById('password');const button=document.querySelector('.password-toggle');field.type=field.type==='password'?'text':'password';button.textContent=field.type==='password'?'Show':'Hide';}</script>
</body>
</html>
