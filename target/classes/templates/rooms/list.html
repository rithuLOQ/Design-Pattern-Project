<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: header-css}"></head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(activePage='rooms')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/header :: top-navbar(pageHeader='Room Management')}"></div>

        <div class="page-body">
            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Table Header Card -->
            <div class="content-card">
                <div class="content-card-header flex-wrap gap-3">
                    <form th:action="@{/rooms}" method="get" class="d-flex gap-2 flex-grow-1" style="max-width: 450px;">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control bg-light border-start-0" placeholder="Search by room number, floor...">
                            <button type="submit" class="btn btn-primary">Search</button>
                        </div>
                    </form>
                    <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/rooms/new}" class="btn btn-primary-custom">
                        <i class="bi bi-plus-square-fill me-1"></i> Add Room
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-custom align-middle">
                        <thead>
                            <tr>
                                <th>Room Number</th>
                                <th>Floor</th>
                                <th>Type</th>
                                <th>Occupancy</th>
                                <th>Status</th>
                                <th sec:authorize="hasRole('ROLE_ADMIN')">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rm : ${roomPage.content}">
                                <td class="fw-bold text-dark" th:text="${rm.roomNumber}">A-101</td>
                                <td th:text="${'Floor ' + rm.floor}">Floor 1</td>
                                <td><span class="badge bg-light text-dark border" th:text="${rm.roomType}">DOUBLE</span></td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="progress flex-grow-1" style="height: 8px;">
                                            <div class="progress-bar" 
                                                 th:classappend="${rm.occupiedCount >= rm.capacity ? 'bg-danger' : 'bg-primary'}"
                                                 th:style="'width: ' + ${(rm.occupiedCount * 100) / rm.capacity} + '%'">
                                            </div>
                                        </div>
                                        <span class="small fw-semibold" th:text="${rm.occupiedCount + '/' + rm.capacity}">1/2</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${rm.status.name() == 'AVAILABLE' ? 'bg-success' : (rm.status.name() == 'FULL' ? 'bg-danger' : 'bg-warning text-dark')}"
                                          th:text="${rm.status}">AVAILABLE
                                    </span>
                                </td>
                                <td sec:authorize="hasRole('ROLE_ADMIN')">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/rooms/edit/{id}(id=${rm.id})}" class="btn btn-light border" title="Edit Room"><i class="bi bi-pencil"></i> Edit</a>
                                        <a href="javascript:void(0);" th:onclick="'confirmDelete(\'/rooms/delete/' + ${rm.id} + '\', \'Room ' + ${rm.roomNumber} + '\')'" class="btn btn-light border text-danger" title="Delete Room">
                                            <i class="bi bi-trash"></i> Delete
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(roomPage.content)}">
                                <td colspan="6" class="text-center py-4 text-muted">No room records found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${totalPages > 1}" class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
                    <div class="small text-muted">Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span></div>
                    <ul class="pagination pagination-sm m-0">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/rooms(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${i == currentPage ? 'active' : ''}">
                            <a class="page-link" th:href="@{/rooms(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/rooms(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer :: footer-scripts}"></div>
    </div>
</div>

</body>
</html>
