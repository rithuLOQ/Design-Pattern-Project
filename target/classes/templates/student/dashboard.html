<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid app-layout">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: studentSidebar}"></div>
        </div>
        <main class="content-column">
            <div class="page-heading"><div><p class="eyebrow">Your residence</p><h1 th:text="${student.name}">Student dashboard</h1></div></div>
            <div class="surface-card p-4 mb-4">
                    <p class="mb-1"><strong>Registration:</strong> <span th:text="${student.registrationNumber}"></span></p>
                    <p class="mb-1"><strong>Department:</strong> <span th:text="${student.department}"></span></p>
                    <p class="mb-0"><strong>Room:</strong> <span th:text="${student.room != null ? student.room.roomNumber : 'Not allocated'}"></span></p>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="stat-card">
                            <h5>Complaint Summary</h5>
                            <p th:text="${complaints.size()} + ' complaint(s)'"></p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="stat-card">
                            <h5>Fee Summary</h5>
                            <p th:text="${fees.size()} + ' fee record(s)'"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
