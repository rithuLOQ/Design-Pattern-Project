<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: studentSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Profile</h2>
            <div class="card">
                <div class="card-body">
                    <p><strong>Name:</strong> <span th:text="${student.name}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${student.phone}"></span></p>
                    <p><strong>Department:</strong> <span th:text="${student.department}"></span></p>
                    <p><strong>Registration:</strong> <span th:text="${student.registrationNumber}"></span></p>
                    <p><strong>Year:</strong> <span th:text="${student.year}"></span></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
