<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Smart Hostel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4 text-center" style="max-width: 500px;">
        <div class="text-danger display-1 mb-3"><i class="bi bi-exclamation-octagon"></i></div>
        <h3 th:text="${errorTitle != null ? errorTitle : 'An Error Occurred'}">Error</h3>
        <p class="text-muted" th:text="${errorMessage != null ? errorMessage : 'Something went wrong.'}">Details</p>
        <a th:href="@{/dashboard}" class="btn btn-primary mt-3">Back to Dashboard</a>
    </div>
</body>
</html>
