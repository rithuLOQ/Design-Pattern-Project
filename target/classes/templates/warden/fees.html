<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fees | Smart Hostel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-shell">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid app-layout">
    <aside class="sidebar-column"><div th:replace="~{fragments/sidebar :: wardenSidebar}"></div></aside>
    <main class="content-column">
        <div class="page-heading"><div><p class="eyebrow">Finance overview</p><h1>Fees</h1></div></div>
        <div class="table-card">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Student</th><th>Amount</th><th>Due date</th><th>Status</th></tr></thead>
                    <tbody>
                    <tr th:each="fee : ${fees}">
                        <td th:text="${fee.student.name}">Student</td>
                        <td th:text="${fee.amount}">0.00</td>
                        <td th:text="${fee.dueDate}">2026-01-01</td>
                        <td><span class="status-badge" th:classappend="${fee.status.name() == 'PAID'} ? ' status-success' : ' status-warning'" th:text="${fee.status}">PENDING</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(fees)}"><td colspan="4" class="empty-row">No fee records yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
