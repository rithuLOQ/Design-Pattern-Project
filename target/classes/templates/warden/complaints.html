<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Warden Complaints</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-2">
            <div th:replace="~{fragments/sidebar :: wardenSidebar}"></div>
        </div>
        <div class="col-md-10">
            <h2>Complaints</h2>
            <table class="table table-striped table-bordered">
                <thead><tr><th>Student</th><th>Title</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="complaint : ${complaints}">
                    <td th:text="${complaint.student.name}"></td>
                    <td th:text="${complaint.title}"></td>
                    <td th:text="${complaint.status}"></td>
                    <td>
                        <form th:action="@{/warden/complaints/resolve/{id}(id=${complaint.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-success">Resolve</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
