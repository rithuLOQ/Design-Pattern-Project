<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="sidebar" class="app-sidebar">
    <div class="sidebar-header">
        <i class="bi bi-building-gear"></i>
        <div class="sidebar-brand">SMART HOSTEL</div>
    </div>

    <ul class="sidebar-menu">
        <li class="menu-category">Main Menu</li>
        <li>
            <a th:href="@{/dashboard}" class="nav-link-custom" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li class="menu-category" sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_WARDEN')">Management</li>
        <li sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_WARDEN')">
            <a th:href="@{/students}" class="nav-link-custom" th:classappend="${activePage == 'students' ? 'active' : ''}">
                <i class="bi bi-people"></i>
                <span>Students</span>
            </a>
        </li>
        <li sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_WARDEN')">
            <a th:href="@{/rooms}" class="nav-link-custom" th:classappend="${activePage == 'rooms' ? 'active' : ''}">
                <i class="bi bi-door-open"></i>
                <span>Rooms</span>
            </a>
        </li>

        <li class="menu-category">Services</li>
        <li>
            <a th:href="@{/complaints}" class="nav-link-custom" th:classappend="${activePage == 'complaints' ? 'active' : ''}">
                <i class="bi bi-exclamation-triangle"></i>
                <span>Complaints</span>
            </a>
        </li>
        <li>
            <a th:href="@{/fees}" class="nav-link-custom" th:classappend="${activePage == 'fees' ? 'active' : ''}">
                <i class="bi bi-receipt"></i>
                <span>Hostel Fees</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="small fw-semibold text-light mb-1">
            <i class="bi bi-diagram-3-fill text-info me-1"></i> GoF Patterns Active
        </div>
        <div class="small text-muted" style="font-size: 0.75rem;">
            Singleton • Factory Method • Builder
        </div>
    </div>
</div>

</body>
</html>
