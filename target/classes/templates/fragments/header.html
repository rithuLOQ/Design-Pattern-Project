<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - Smart Hostel' : 'Smart Hostel Management System'}">Smart Hostel</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:fragment="top-navbar" class="top-navbar">
    <div class="d-flex align-items-center gap-3">
        <h4 class="navbar-page-title" th:text="${pageHeader != null ? pageHeader : 'Dashboard'}">Dashboard</h4>
    </div>

    <div class="user-profile-badge" sec:authorize="isAuthenticated()">
        <div class="avatar-circle">
            <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
        </div>
        <div class="d-none d-md-block">
            <div class="fw-bold text-dark" sec:authentication="name">User</div>
            <div class="text-muted small" sec:authentication="principal.authorities[0]">ROLE</div>
        </div>
        <form th:action="@{/logout}" method="post" class="ms-3">
            <button type="submit" class="btn btn-outline-danger btn-sm" title="Logout">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>
</div>

</body>
</html>
